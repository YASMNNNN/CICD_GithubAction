name: build-and-push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  security-events: write   # requis pour upload SARIF vers GitHub Security

jobs:

  # ─────────────────────────────────────────────
  # JOB 1 : BUILD
  # ─────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    environment: testing
    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set short SHA
        id: set_tag
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "IMAGE_TAG=$SHORT_SHA" >> $GITHUB_ENV
          echo "image_tag=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Image tag: $SHORT_SHA"

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/gitomyapp:${{ env.IMAGE_TAG }} .

      - name: Save Docker Image
        run: docker save ${{ secrets.DOCKER_USERNAME }}/gitomyapp:${{ env.IMAGE_TAG }} -o image.tar

      - name: Upload Docker artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  # ─────────────────────────────────────────────
  # JOB 2 : SAST — Analyse statique du code source
  # ─────────────────────────────────────────────
  sast-code:
    runs-on: ubuntu-latest
    needs: [build]
    environment: testing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep (SAST)
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/secrets
            p/docker
          generateSarif: "1"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}   # optionnel si compte Semgrep Cloud
        continue-on-error: true   # mettre à false pour bloquer en cas de findings critiques

      - name: Upload Semgrep SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # ─────────────────────────────────────────────
  # JOB 3 : SAST — Scan de l'image Docker (CVE)
  # ─────────────────────────────────────────────
  sast-image:
    runs-on: ubuntu-latest
    needs: [build]
    environment: testing
    steps:
      - name: Set image tag from build
        run: echo "IMAGE_TAG=${{ needs.build.outputs.image_tag }}" >> $GITHUB_ENV

      - name: Download Docker artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker Image
        run: docker load -i image.tar

      - name: Run Trivy — scan vulnérabilités image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.DOCKER_USERNAME }}/gitomyapp:${{ env.IMAGE_TAG }}"
          format: sarif
          output: trivy-results.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "0"   # mettre à 1 pour bloquer sur CRITICAL/HIGH

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      - name: Trivy — rapport lisible en console
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.DOCKER_USERNAME }}/gitomyapp:${{ env.IMAGE_TAG }}"
          format: table
          severity: "CRITICAL,HIGH"
          exit-code: "0"

  # ─────────────────────────────────────────────
  # JOB 4 : PUSH (conditionné aux SAST)
  # ─────────────────────────────────────────────
  push:
    runs-on: ubuntu-latest
    needs: [build, sast-code, sast-image]   # ← bloqué si un SAST échoue
    environment: testing
    steps:
      - name: Set image tag from build
        run: echo "IMAGE_TAG=${{ needs.build.outputs.image_tag }}" >> $GITHUB_ENV

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker Image
        run: docker load -i image.tar

      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/gitomyapp:${{ env.IMAGE_TAG }}

      - name: Push completed
        run: 'echo "Push completed - Image tag: ${{ env.IMAGE_TAG }}"'

  # ─────────────────────────────────────────────
  # JOB 5 : DEPLOY
  # ─────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [build, push]
    environment: testing
    steps:
      - name: Set image tag from build
        run: echo "IMAGE_TAG=${{ needs.build.outputs.image_tag }}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Kubernetes manifests
        run: |
          sed -i "s|image: ${{ secrets.DOCKER_USERNAME }}/gitomyapp:.*|image: ${{ secrets.DOCKER_USERNAME }}/gitomyapp:${{ env.IMAGE_TAG }}|g" k8s/deployment.yaml

      - name: Verify changes
        run: cat k8s/deployment.yaml

      - name: Commit and push changes
        run: |
          git config --global user.name "YASSMINE GRASSA"
          git config --global user.email "yasminegr432@gmail.com"
          git add k8s/deployment.yaml
          git commit -m "Update image to ${{ secrets.DOCKER_USERNAME }}/gitomyapp:${{ env.IMAGE_TAG }}" || echo "No changes to commit"
          git push

      - name: Deploy completed
        run: 'echo "Manifests updated with latest tag: ${{ env.IMAGE_TAG }}"'
